name: Satzung PDF

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Metadaten (Datum & Version)
        run: |
          DATE="$(date +%d.%m.%Y)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          sed -i "s/\[Datum\]/$DATE/" satzung.md
          cat > metadata.yaml <<EOF
          title: Satzung des Fest der Demokratie e.V.
          author: Fest der Demokratie e.V.
          subtitle: "Version $VERSION"
          fontsize: 11pt
          linestretch: 1.15
          mainfont: IBMPlexSerif-Regular.ttf
          mainfontoptions:
            - "Path=./fonts/"
            - "BoldFont=IBMPlexSerif-Bold.ttf"
            - "ItalicFont=IBMPlexSerif-Italic.ttf"
            - "BoldItalicFont=IBMPlexSerif-BoldItalic.ttf"
          EOF

      - name: Build PDF
        uses: docker://pandoc/latex:latest
        with:
          args: >-
            satzung.md
            -o satzung.pdf
            --pdf-engine=xelatex
            --metadata-file=metadata.yaml
            -V lang=de
            -V geometry:margin=2.5cm
            -V linkcolor=blue

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: satzung-pdf
          path: satzung.pdf

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: satzung.pdf
