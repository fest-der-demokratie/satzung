name: Satzung PDF

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDF
        uses: docker://pandoc/latex:latest
        with:
          args: >-
            satzung.md
            -o satzung.pdf
            --pdf-engine=xelatex
            --toc
            -V toc-title=Inhaltsverzeichnis
            -V lang=de
            -V geometry:margin=2.5cm
            -V linkcolor=blue
            --metadata title=Satzung
            --metadata author="Fest der Demokratie e.V."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: satzung-pdf
          path: satzung.pdf

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: satzung.pdf
